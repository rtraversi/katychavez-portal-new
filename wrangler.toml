# IurisIQ Portal — Cloudflare Workers config — Katy Chavez deployment
name = "katychavez-portal-new"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./_worker.js"

[assets]
directory = "."
binding = "ASSETS"

# ── CPU limit (requires Workers Paid) ────────────────────────────────────────
# The form-filler parses and re-saves whole USCIS PDFs in-Worker: the biggest
# (I-485: 736 fields, 1.5 MB) needs ~2.8s to hand back a template and ~4.5s to
# generate or finalize a draft, since a form being filed needs real appearance
# streams rebuilt. On the Free plan's ~2-3s ceiling that surfaced as Cloudflare
# error 1102 -- a bare 503 with no JSON body to explain it. This account moved
# to Workers Paid on 2026-07-30 for exactly that reason; dropping back to Free
# means dropping this block (it is rejected there, error 100328) and taking the
# intermittent failures on the big forms with it.
[limits]
cpu_ms = 60000

# ── R2 native binding (required for browser file uploads) ────────────────────
# The S3-compatible API cannot be used for Worker→R2 PUTs (CF same-zone restriction).
# The native binding bypasses HTTP entirely and is the only reliable write path.
[[r2_buckets]]
binding    = "R2"
bucket_name = "katychavez-portal"

[triggers]
crons = ["0 14 * * *", "*/5 * * * *"]   # Daily 9am CST: doc reminders | Every 5 min: message notifications

