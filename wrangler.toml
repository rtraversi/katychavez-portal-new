# IurisIQ Portal — Cloudflare Workers config — Katy Chavez deployment
name = "katychavez-portal-new"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./_worker.js"

[assets]
directory = "."
binding = "ASSETS"

# ── CPU budget ───────────────────────────────────────────────────────────────
# This account is on the Workers FREE plan, where `[limits] cpu_ms` is rejected
# at deploy time (error 100328) and the per-request CPU ceiling is a couple of
# seconds. The form-filler parses and re-saves whole USCIS PDFs in-Worker, and
# the biggest (I-485: 736 fields, 1.5 MB) sits right at that ceiling -- going
# over is Cloudflare error 1102, which reaches the browser as a bare 503 with
# no JSON body to explain it. So: keep form-filler-template-defaults.js on its
# no-parse / no-appearance-rebuild paths. Moving to Workers Paid and setting
# `[limits] cpu_ms = 60000` is what actually retires this constraint -- and is
# the only fix for generate/finalize, which must rebuild appearances and cannot
# be trimmed the same way.

# ── R2 native binding (required for browser file uploads) ────────────────────
# The S3-compatible API cannot be used for Worker→R2 PUTs (CF same-zone restriction).
# The native binding bypasses HTTP entirely and is the only reliable write path.
[[r2_buckets]]
binding    = "R2"
bucket_name = "katychavez-portal"

[triggers]
crons = ["0 14 * * *", "*/5 * * * *"]   # Daily 9am CST: doc reminders | Every 5 min: message notifications

