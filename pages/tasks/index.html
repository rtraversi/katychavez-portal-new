<!-- Tasks page — loaded dynamically into #page-content by menu.js -->
<!-- Docket-kit masthead (see .dk-* in portal.css / DESIGN-SYSTEM.md) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Daily Work · Tasks</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Your firm's <em>work list</em>.</h1>
  <p class="dk-sub rise" id="tasks-subtitle" style="animation-delay:.13s">Everything open across the firm — what's due, who owns it, and which matter it moves forward.</p>
</div>

<!-- At-a-glance counts (rendered from the loaded task set) -->
<div id="tasks-deskbar"></div>

<!-- Toolbar — search + filters + actions (handler ids preserved) -->
<div class="dk-toolbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="task-search" placeholder="Search tasks…">
  </div>
  <select id="filter-task-status">
    <option value="open">Open</option>
    <option value="">All</option>
    <option value="pending">Pending</option>
    <option value="in_progress">In progress</option>
    <option value="completed">Completed</option>
    <option value="cancelled">Cancelled</option>
  </select>
  <select id="filter-task-priority">
    <option value="">All priorities</option>
    <option value="urgent">Urgent</option>
    <option value="high">High</option>
    <option value="normal">Normal</option>
    <option value="low">Low</option>
  </select>
  <button class="btn btn--secondary" id="btn-toggle-mine">My tasks only</button>
  <button class="btn btn--primary" id="btn-new-task">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New task
  </button>
</div>

<!-- Task register -->
<div id="tasks-list">
  <div class="dk-empty">Loading…</div>
</div>

<!-- New/edit task modal -->
<div id="task-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="task-modal-title"></div>
