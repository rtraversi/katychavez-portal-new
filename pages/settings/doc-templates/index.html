<!-- Settings: Client Document Checklist — loaded dynamically into #page-content by menu.js -->
<!-- Docket-kit masthead (see DESIGN-SYSTEM.md) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Settings · Document checklist</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Client <em>document</em> checklist.</h1>
  <p class="dk-sub rise" style="animation-delay:.13s">The documents you ask clients for, organized by case type and applied when staff run "Apply Checklist" on a matter. Editable Word templates live under Word Templates.</p>
</div>

<div class="dk-sec" style="margin-bottom:0">
  <div class="dk-sec-head">
    <h2>Requested documents</h2>
    <span class="dk-sec-rule"></span>
    <button class="dk-sec-add" id="btn-add-template" type="button">Custom item</button>
    <button class="dk-sec-add" id="btn-browse-library" type="button">＋ Add document</button>
  </div>

  <!-- Case type filter — populated dynamically from practice_areas + case_types tables -->
  <div id="dt-filter-bar" style="margin-bottom:var(--space-4)">
    <span class="text-sm text-muted">Loading…</span>
  </div>

  <!-- Register of requested documents -->
  <div id="templates-tbody">
    <div class="dk-empty" style="margin-top:var(--space-4)">Loading…</div>
  </div>
</div>

<!-- Add/Edit modal -->
<div id="dt-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>

<!-- Library picker modal -->
<div id="lib-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>
