<!-- Docket-kit masthead (see DESIGN-SYSTEM.md) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Settings · Users</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Your <em>team</em>.</h1>

</div>

    <h2>Staff accounts</h2><span class="dk-sec-rule"></span>
    <span class="dk-sec-count" id="users-count"></span>

  </div>
  <div id="users-tbody">
    <div class="dk-empty" style="margin-top:var(--space-4)">Loading…</div>
