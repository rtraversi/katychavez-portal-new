<!-- Dashboard page — loaded dynamically into #page-content by menu.js -->
<!-- Docket-kit (see .dk-* in portal.css / DESIGN-SYSTEM.md) -->
<style>
/* Page-local layout only — colors/type come from the Docket kit tokens. */
.dash-attention-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 30px 40px;
}
.dash-widget { min-width: 0; }
.dash-widget .dk-sec-head { margin-bottom: 14px; }
/* Per-widget accent — --hue/--hue-tint set inline by dashboard.js */
.dash-widget .dk-register { border-top-color: var(--hue, var(--ink)); }
.dash-widget .dk-sec-count {
  background: var(--hue-tint, var(--paper-deep));
  color: var(--hue, var(--ink-faint));
  border-radius: 999px; padding: 2px 9px; font-weight: 700;
}
</style>

<!-- Masthead — greeting (serif) + today's date (kept ids for JS to fill) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Daily Work · Dashboard</div>
  <h1 class="dk-title rise" id="dash-greeting" style="animation-delay:.09s">Dashboard</h1>
  <p class="dk-sub rise" id="dash-date" style="animation-delay:.13s"></p>
</div>

<!-- Toolbar — refresh action (id preserved) -->
<div class="dk-toolbar">
  <span class="dk-spacer"></span>
  <button class="btn btn--secondary" id="btn-refresh-dash" style="display:flex;align-items:center;gap:var(--space-2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    Refresh
  </button>
</div>

<!-- At a glance — desk-chip strip (rendered by JS) -->
<div id="dash-stats-row"><!-- deskbar rendered by JS --></div>

<!-- Needs attention — one register per work area -->
<div class="dk-sec-head"><h2>Needs Attention</h2><span class="dk-sec-rule"></span></div>
<div class="dash-attention-grid" id="dash-attention-grid">
  <div class="dk-empty">Loading…</div>
</div>
