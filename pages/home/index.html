<div class="home-page" id="home-page">
  <header class="home-masthead rise">
    <div class="home-kicker" id="home-dateline"></div>
    <h1 class="home-greet" id="home-greeting">Good morning</h1>
    <p class="home-greet-sub" id="home-greet-sub">Here&rsquo;s what&rsquo;s on your desk.</p>
  </header>

  <div class="home-desk rise" id="home-desk" style="animation-delay:.06s" hidden></div>

  <div class="home-cols" id="home-cols">
    <main class="home-sections" id="home-sections">
      <div class="page-skeleton" aria-busy="true" aria-label="Loading…"></div>
    </main>

    <aside class="home-docket" id="home-docket" aria-label="Today's Docket">
      <div class="home-docket-head rise" style="animation-delay:.12s">Today&rsquo;s Docket <span class="home-rule"></span></div>
      <div class="home-panel rise" style="animation-delay:.16s">
        <h3>Upcoming Deadlines</h3>
        <p class="home-panel-sub">Next 7 open tasks</p>
        <div class="home-dl" id="deadlines-list"><p class="home-widget-placeholder">Loading…</p></div>
      </div>
      <div class="home-panel rise" style="animation-delay:.22s">
        <h3>Recent Activity</h3>
        <p class="home-panel-sub">Across all matters</p>
        <div class="home-act" id="activity-list"><p class="home-widget-placeholder">Loading…</p></div>
      </div>
      <div class="home-panel rise" id="home-payments-panel" style="animation-delay:.28s" hidden>
        <h3>Recent Payments</h3>
        <p class="home-panel-sub">Retainers &amp; invoices paid</p>
        <div class="home-act" id="payments-list"><p class="home-widget-placeholder">Loading…</p></div>
      </div>
    </aside>
  </div>
</div>
