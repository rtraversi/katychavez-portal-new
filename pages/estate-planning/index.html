<!-- Estate Planning — questionnaires across all matters. Loaded into #page-content by menu.js.
     Per-client work (send, answers, drafting) happens on the client card's Estate Planning tab. -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Documents &amp; Drafting · Estate Planning</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Wills &amp; trusts <em>questionnaires</em>.</h1>
  <p class="dk-sub rise" style="animation-delay:.13s">Who has been sent the questionnaire, who is part-way through, and whose answers are ready to review. Open a client to send a link, edit answers, or draft documents.</p>
</div>

<div id="ep-deskbar"></div>

<section class="dk-sec" id="ep-sec-ready">
  <div class="dk-sec-head"><h2>Ready to review</h2><span class="dk-sec-rule"></span><span class="dk-sec-count" id="ep-count-ready"></span></div>
  <div id="ep-list-ready"><p class="dk-empty">Loading…</p></div>
</section>

<section class="dk-sec" id="ep-sec-open">
  <div class="dk-sec-head"><h2>Waiting on the client</h2><span class="dk-sec-rule"></span><span class="dk-sec-count" id="ep-count-open"></span></div>
  <div id="ep-list-open"><p class="dk-empty">Loading…</p></div>
</section>
