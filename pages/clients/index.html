<!-- Clients page — loaded dynamically into #page-content by menu.js -->
<!-- Docket-kit masthead (see .dk-* in portal.css / DESIGN-SYSTEM.md) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Daily Work · Clients &amp; Matters</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Every client, every <em>matter</em>.</h1>
  <p class="dk-sub rise" style="animation-delay:.13s">The firm's full roster — who they are, what they're here for, and where their retainer stands.</p>
</div>

<!-- Toolbar — search + filters + actions (handler ids preserved) -->
<div class="dk-toolbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="client-search" placeholder="Search by name or email…">
  </div>
  <select id="filter-status">
    <option value="">All statuses</option>
    <option value="active">Active</option>
    <option value="intake">Intake</option>
    <option value="on_hold">On hold</option>
    <option value="closed">Closed</option>
  </select>
  <select id="filter-case-type">
    <option value="">All case types</option>
  </select>
  <div class="dk-spacer"></div>
  <button class="btn btn--primary" id="btn-new-client">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New client
  </button>
</div>

<!-- Client register (rendered by clients.js) -->
<div id="clients-list">
  <div class="dk-empty">Loading…</div>
</div>

<!-- Pagination -->
<div id="clients-pagination" class="flex items-center gap-3 mt-4 text-sm text-muted" style="justify-content:flex-end"></div>

<!-- New / Edit client modal (rendered by clients.js) -->
<div id="client-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
