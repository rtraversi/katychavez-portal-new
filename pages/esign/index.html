<!-- Module: esign — loaded dynamically into #page-content by menu.js -->
<!-- Docket-kit masthead (see .dk-* in portal.css / DESIGN-SYSTEM.md) -->
<div class="dk-masthead">
  <div class="dk-kicker rise" style="animation-delay:.04s">Documents &amp; Drafting · E-Signatures</div>
  <h1 class="dk-title rise" style="animation-delay:.09s">Signatures, <em>executed cleanly</em>.</h1>
  <p class="dk-sub rise" id="esign-subtitle" style="animation-delay:.13s">Every signature request across the firm — who still owes a signature, what's fully executed, and the audit trail behind each one.</p>
</div>

<!-- ── Pending counter-signatures (attorney queue) ─────────────────────── -->
<div class="dk-sec" id="esign-countersign-card">
  <div class="dk-sec-head">
    <h2>Awaiting your counter-signature</h2>
    <span class="dk-sec-rule"></span>
    <span class="dk-sec-count" id="esign-countersign-count" style="display:none"></span>
  </div>
  <div id="esign-countersign-list"></div>
</div>

<!-- ── All requests register ───────────────────────────────────────────── -->
<div class="dk-sec">
  <div class="dk-sec-head">
    <h2>All signature requests</h2>
    <span class="dk-sec-rule"></span>
  </div>
  <div class="dk-toolbar">
    <div class="dk-spacer"></div>
    <select id="esign-filter-status">
      <option value="">All statuses</option>
      <option value="pending_client">Pending client</option>
      <option value="pending_attorney">Pending attorney</option>
      <option value="completed">Completed</option>
      <option value="declined">Declined</option>
      <option value="expired">Expired</option>
    </select>
  </div>
  <div id="esign-list">
    <div class="dk-empty">Loading…</div>
  </div>
</div>

<!-- Counter-sign modal -->
<div id="esign-sign-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>
